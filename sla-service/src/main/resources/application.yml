server:
  port: 8080

spring:
  application:
    name: sla-service

  datasource:
    url: jdbc:postgresql://db:5432/sla
    username: sla_user
    password: sla_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  swagger-ui:
    path: /docs

sla:
  b2c:

    reaction-minutes: 30        # SLA-1: время реакции менеджера
    to-assembly-hours: 4        # SLA-2: от реакции до сборки
    assembly-to-delivery-days: 1 # SLA-3: сборка до передачи в доставку
    total-days: 2               # B2C-total: полный цикл B2C

  delivery:
    to-pvz-days: 5              # SLA-4: до ПВЗ
    pvz-storage-days: 7         # SLA-5: хранение на ПВЗ
    total-days: 14              # DEL-total: полный цикл доставки

  full-cycle-days: 16           # FULL: полный цикл сделки

  breach-buckets:
    short-minutes: [15, 60]     # для SLA-1: до 15 / 15-60 / >60 мин
    days: [1, 3]                # для остальных: до 1 / 1-3 / >3 дней