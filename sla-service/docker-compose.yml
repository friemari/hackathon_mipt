version: '3.9'

services:
  db:
    image: postgres:15
    container_name: sla_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sla}
      POSTGRES_USER: ${POSTGRES_USER:-sla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sla_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sla_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sla_app
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/sla}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sla_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-sla_pass}
      ML_API_URL: http://ml-server:8000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ml-server:
    build:
      context: ./ModuleML
      dockerfile: Dockerfile.ml
    container_name: ml_server
    ports:
      - "8000:8000"
    volumes:
      - ml_models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  ml_models: